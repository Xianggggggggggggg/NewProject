<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>職缺管理 - CareerLab</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/0company.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>

  <div class="section-container active">
    <h2 style="color: var(--primary-green); margin-bottom: 20px;">💼 職缺管理</h2>
    
    <div class="job-list-wrapper glass-panel" id="job-list-container">
      
      <div class="job-row header-row">
        <div class="col-dept">所屬部門</div>
        <div class="col-title">職缺名稱</div>
        <div class="col-count">需求人數</div>
        <div class="col-action">操作</div>
      </div>
      
      <div id="job-list-body"></div>
    </div>

    <template id="job-template">
      <div class="job-row item-row">
        <div class="col-dept js-dept"></div>
        <div class="col-title js-title"></div>
        <div class="col-count">
          <span class="count-badge js-count">0</span>
        </div>
        <div class="col-action">
          <button class="icon-btn js-edit-btn">✏️</button>
          <button class="icon-btn js-delete-btn">🗑️</button>
        </div>
      </div>
    </template>

    <button class="floating-add-btn" onclick="openJobModal()">＋ 新增職缺</button>
  </div>

  <div id="job-modal-overlay" class="modal-overlay">
    <div class="register-modal resume-form-modal">
      <h2 id="job-modal-title">新增職缺</h2>
      <p>設定職缺的詳細內容與條件</p>
      
      <input type="hidden" id="job-id">
      
      <div style="display: flex; gap: 10px;">
        <input type="text" id="job-dept" class="reg-input" style="flex: 2;" placeholder="部門 ">
        <input type="text" id="job-title" class="reg-input" style="flex: 2;" placeholder="職缺名稱 ">
        <input type="text" id="job-count" class="reg-input" style="flex: 1;" placeholder="人數 ">
      </div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="job-salary" class="reg-input" style="flex: 1;" placeholder="薪水 ">

      </div>
      <textarea id="job-desc" class="reg-input" placeholder="工作內容 (可條列式填寫)"></textarea>
      <textarea id="job-req" class="reg-input" placeholder="條件要求 (可條列式填寫)"></textarea>
      <textarea id="job-time" class="reg-input" placeholder="上班時間與休假 "></textarea>
      
      <textarea id="job-other" class="reg-input" style="min-height: 80px;" placeholder="其他福利或備註 "></textarea>
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
        <label style="color: var(--text-sub); font-weight: bold; width: 50px;">狀態：</label>
        <select id="job-status" class="reg-input" style="margin-bottom: 0; flex: 1;">
          <option value="開啟">🟢 開啟招募</option>
          <option value="關閉">🔴 關閉 (暫停招募)</option>
        </select>
      </div>

      <button class="btn-reg-submit" onclick="saveJob()">儲存職缺</button>
      <a class="back-link" onclick="closeJobModal()">取消並關閉</a>
    </div>
  </div>
  <div id="applicant-list-overlay" class="modal-overlay">
    <div class="register-modal resume-form-modal" style="max-width: 550px;">
      <h2 style="color: var(--primary-green); margin-bottom: 20px;">應徵者狀態清單</h2>
      
      <div id="applicant-list-content" class="applicant-list-wrapper"></div>
      
      <button class="btn-green" style="width: 100%; margin-top: 25px; padding: 15px; border-radius: 10px;" onclick="closeApplicantListModal()">關閉清單</button>
    </div>
  </div>

  <script src="../js/0company.js" defer></script>
</body>
</html>
