<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>職缺詳情 - CareerLab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>

  <div class="section-container active" style="align-items: center;" id="job-detail-container">
    <div style="width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px;">
      <div>
        <button class="btn-glass" style="padding: 5px 15px; margin-bottom: 20px;" onclick="window.location.href='lobby.html'">← 返回大廳</button>
        <div style="font-size: 18px; color: var(--text-sub); margin-bottom: 5px;" id="job-dept">載入中...</div>
        <div style="font-size: 36px; font-weight: bold; color: var(--text-main); margin-bottom: 10px;" id="job-title">載入中...</div>
        <div style="font-size: 24px; color: #d9534f; font-weight: bold;" id="job-salary"></div>
      </div>
      
      <div style="display: flex; gap: 15px; align-items: center;">
        <div style="font-size: 30px; cursor: pointer; color: #ccc;">🔖</div>
        <button class="btn-green" style="padding: 15px 40px; font-size: 20px;" onclick="handleApplyAction()">應徵</button>
      </div>
    </div>

    <div class="glass-panel" style="width: 100%; max-width: 1000px; padding: 40px; text-align: left;">
      <div class="detail-section">
        <h3>工作內容</h3>
        <p id="job-desc" style="white-space: pre-wrap;">載入中...</p>
      </div>
      <div class="detail-section">
        <h3>條件要求</h3>
        <p id="job-req" style="white-space: pre-wrap;">載入中...</p>
      </div>
      <div class="detail-section">
        <h3>上班時間與休假</h3>
        <p id="job-time" style="white-space: pre-wrap;">載入中...</p>
      </div>
      <div class="detail-section">
        <h3>其他福利</h3>
        <p id="job-other" style="white-space: pre-wrap;">載入中...</p>
      </div>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
