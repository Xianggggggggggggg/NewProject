<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智慧面試系統</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    /* ================= 顏色與玻璃參數變數 ================= */
    :root {
      --primary-green: #799851; 
      --primary-green-hover: #6a8546; 
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 1);
      --glass-shadow: rgba(0, 0, 0, 0.05);
      --glass-blur: blur(16px);
      --text-main: #2d3436;
      --text-sub: #636e72;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 0;
      background-color: #f4f7f8;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(16, 172, 132, 0.08), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(41, 128, 185, 0.05), transparent 30%);
      background-size: cover; background-attachment: fixed; color: var(--text-main);
      height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
    }

    .glass-panel {
      background: var(--glass-bg); backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur); border: 1.5px solid var(--glass-border);
      border-radius: 16px; box-shadow: 0 8px 32px 0 var(--glass-shadow);
    }

    #top-bar {
      display: none; justify-content: space-between; align-items: center; padding: 15px 20px;
      background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 10;
    }
    .menu-icon { font-size: 28px; cursor: pointer; font-weight: bold; color: var(--text-main); transition: 0.3s; }
    .menu-icon:hover { color: var(--primary-green); }
    .top-title { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: var(--text-main); }

    .sidebar {
      position: fixed; left: -280px; top: 0; width: 280px; height: 100%; z-index: 1000;
      padding: 20px; box-sizing: border-box; transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 0 20px 20px 0; border-left: none;
    }
    .sidebar.open { left: 0; }
    .sidebar-menu { font-size: 24px; cursor: pointer; margin-bottom: 40px; font-weight: bold; color: var(--text-main); transition: 0.3s; }
    .sidebar-menu:hover { color: var(--primary-green); }
    .menu-item {
      padding: 15px 10px; font-size: 18px; border-bottom: 1px solid rgba(0,0,0,0.05);
      cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s;
      border-radius: 8px; color: var(--text-main);
    }
    .menu-item:hover { background: rgba(0,0,0,0.03); color: var(--primary-green); padding-left: 20px; }
    
    .overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.3); backdrop-filter: blur(4px); z-index: 999;
    }
    .overlay.active { display: block; }

    .section-container {
      display: none; flex: 1; flex-direction: column; position: relative; padding: 30px; overflow-y: auto;
    }
    .section-container.active { display: flex; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    #login-section { justify-content: center; align-items: center; }
    .logo-text { font-size: 56px; font-weight: 300; letter-spacing: 15px; margin-bottom: 50px; color: var(--text-main); }
    .auth-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 20px; padding: 40px; }
    
    input { 
      padding: 15px; font-size: 16px; background: rgba(255, 255, 255, 0.8); 
      border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 8px; color: var(--text-main); transition: 0.3s; 
    }
    input::placeholder { color: #aaa; }
    input:focus { outline: none; border-color: var(--primary-green); background: #fff; box-shadow: 0 0 10px rgba(16, 172, 132, 0.1); }

    button { 
      padding: 14px 0; font-size: 16px; border: 1px solid rgba(0,0,0,0.05); 
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; letter-spacing: 1px;
    }
    .btn-green { background: var(--primary-green); border-color: transparent; color: white; }
    .btn-green:hover { background: var(--primary-green-hover); box-shadow: 0 4px 15px rgba(121, 152, 81, 0.3); }
    .btn-glass { background: rgba(255, 255, 255, 0.6); color: var(--text-main); border: 1px solid rgba(0,0,0,0.1); }
    .btn-glass:hover { background: rgba(255, 255, 255, 1); border-color: rgba(0,0,0,0.2); }
    .btn-row { display: flex; justify-content: space-between; gap: 15px; }
    .btn-row button, .btn-register { flex: 1; }
    .divider { text-align: center; margin: 10px 0; color: #bbb; letter-spacing: 2px; }

    .lobby-bg { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 28px; color: var(--text-sub); margin-bottom: 30px; min-height: 400px; letter-spacing: 5px; }
    .lobby-footer { display: flex; justify-content: flex-start; }
    .btn-start-interview { padding: 15px 40px; font-size: 20px; width: auto; display: inline-block; }

    .setting-group { margin-bottom: 30px; }
    .setting-group h3 { margin-bottom: 15px; color: var(--text-main); font-weight: bold; letter-spacing: 1px; }
    .setting-box { padding: 20px; min-height: 100px; }

    /* ================= 履歷區塊樣式 (修改長度與寬度) ================= */
    .resume-grid { display: flex; flex-wrap: wrap; gap: 35px; }
    .resume-card {
      width: 320px; /* 卡片加寬，更像真實 A4 比例 */
      height: calc(100vh - 140px); /* 讓長度跟頁面可用空間一樣長 */
      min-height: 500px; /* 防止螢幕太小縮成一團 */
      display: flex; flex-direction: column; align-items: center; 
      padding: 50px 30px; box-sizing: border-box; transition: 0.3s;
      border-radius: 20px; /* 稍微加大圓角更柔和 */
    }
    .resume-card:hover { transform: translateY(-8px); border-color: var(--primary-green); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
    .resume-card h3 { 
      margin: 0 0 35px 0; font-size: 22px; color: var(--text-main); 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
      width: 100%; text-align: center; 
    }
    .resume-card button { 
      width: 100%; padding: 14px; margin-bottom: 16px; font-size: 16px; 
      border-radius: 10px; /* 按鈕稍微修圓 */
    }
    
    /* 新增履歷的十字虛線框 */
    .add-resume { 
      justify-content: center; font-size: 80px; color: #ccc; cursor: pointer; 
      border: 3px dashed #ccc; background: rgba(255,255,255,0.4); 
    }
    .add-resume:hover { border-color: var(--primary-green); color: var(--primary-green); background: rgba(121, 152, 81, 0.05); }

    .history-list { width: 100%; border-radius: 16px; overflow: hidden; }
    .history-row { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 18px; transition: 0.3s; }
    .history-row:hover { background: rgba(0,0,0,0.02); }
    .history-row:last-child { border-bottom: none; }
    .icon-view { font-size: 24px; cursor: pointer; opacity: 0.6; transition: 0.3s; color: var(--text-main); }
    .icon-view:hover { opacity: 1; transform: scale(1.1); color: var(--primary-green); }
    .score { color: var(--primary-green); font-weight: bold; }

    #interview-section { align-items: center; }
    .interview-layout { display: flex; gap: 20px; width: 100%; max-width: 1200px; height: 75vh; }
    .video-area { flex: 2; background-color: #000; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid rgba(255,255,255,0.8); }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .transcript-area { flex: 1; padding: 25px; overflow-y: auto; }
    .ai-msg { color: var(--text-main); margin-bottom: 15px; line-height: 1.6; padding: 15px; background: #fff; border-radius: 8px; border-left: 4px solid var(--primary-green); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .controls { margin-top: 30px; display: flex; gap: 20px; }
    .btn-end { background-color: #ff4757; color: white; border-color: transparent; width: 200px; }
    .btn-end:hover { background-color: #ff6b81; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3); }

    /* ================= 彈窗 (Modal) 共用與新增樣式 ================= */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .register-modal {
      width: 90%; max-width: 400px; background: rgba(244, 247, 248, 0.95); 
      backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
      padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-height: 85vh; overflow-y: auto;
    }
    .resume-form-modal { max-width: 500px; padding: 30px; }
    .preview-modal { background: #fff; text-align: left; }
    
    .register-modal h2 { margin: 0 0 5px 0; font-size: 28px; color: var(--text-main); letter-spacing: 2px; }
    .preview-modal h2 { text-align: center; margin-bottom: 20px; color: var(--primary-green); }
    .register-modal p { color: var(--text-sub); margin-bottom: 25px; font-size: 14px; }
    
    .reg-input {
      width: 100%; padding: 15px; margin-bottom: 12px; background: #fff;
      border: 1px solid rgba(0,0,0,0.1); border-radius: 10px; color: var(--text-main);
      box-sizing: border-box; transition: 0.3s; font-family: inherit;
    }
    .reg-input:focus { outline: none; border-color: var(--primary-green); box-shadow: 0 0 8px rgba(121, 152, 81, 0.2); }
    select.reg-input option { color: var(--text-main); }
    textarea.reg-input { resize: vertical; min-height: 100px; line-height: 1.5; }
    
    .btn-reg-submit {
      width: 100%; padding: 15px; background-color: var(--primary-green); color: white;
      font-size: 16px; margin-top: 10px; border: none; border-radius: 10px;
      cursor: pointer; font-weight: bold; transition: 0.3s;
    }
    .btn-reg-submit:hover { background-color: var(--primary-green-hover); }
    
    .back-link { display: block; margin-top: 20px; color: var(--text-sub); text-decoration: none; font-size: 14px; cursor: pointer; transition: 0.3s; }
    .back-link:hover { color: var(--primary-green); }

    /* 預覽排版專用 */
    .preview-item { margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px; }
    .preview-item:last-child { border-bottom: none; }
    .preview-label { font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
    .preview-value { font-size: 16px; font-weight: 500; white-space: pre-wrap; line-height: 1.5; color: var(--text-main); }

    /* 個人資料設定專用樣式 */
    .profile-label { font-size: 14px; color: var(--text-sub); display: block; margin-bottom: 8px; font-weight: bold; }
    .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.15); transition: .4s; border-radius: 34px; border: 1px solid rgba(0,0,0,0.05); }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    input:checked + .slider { background-color: var(--primary-green); border-color: var(--primary-green); }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>

  <div id="top-bar">
    <div class="menu-icon" onclick="toggleMenu()">三</div>
    <div class="top-title" id="page-title">大廳</div>
    <div style="width: 28px;"></div>
  </div>

  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="sidebar glass-panel" id="sidebar">
    <div class="sidebar-menu" onclick="toggleMenu()">三</div>
    <div class="menu-item" onclick="navTo('lobby-section', '大廳')">🏠 回到大廳</div>
    <div class="menu-item" onclick="navTo('profile-section', '個人資料設定')">👤 個人資料設定</div>
    <div class="menu-item" onclick="navTo('resume-section', '我的 resume')">📄 我的 resume</div>
    <div class="menu-item" onclick="navTo('history-section', '歷史紀錄')">🕒 歷史紀錄</div>
    <div class="menu-item" onclick="logout()" style="margin-top: auto; border-top: 1px solid rgba(0,0,0,0.05); border-bottom: none; position: absolute; bottom: 30px; width: calc(100% - 40px); color: #ff4757;">🚪 登出</div>
  </div>

  <div id="login-section" class="section-container active">
    <div class="logo-text">Logo</div>
    <div class="auth-box glass-panel">
      <input type="text" id="login-username" placeholder="帳號 (Username)">
      <input type="password" id="login-password" placeholder="密碼">
      <div class="btn-row">
        <button class="btn-green" id="btnLogin" onclick="handleLogin()">登入</button>
        <button class="btn-glass" onclick="guestLogin()">訪客登入</button>
      </div>
      <div class="divider">OR</div>
      <button class="btn-glass btn-register" onclick="openRegisterModal()">註冊新帳號</button>
    </div>
  </div>

  <div id="lobby-section" class="section-container">
    <div class="lobby-bg glass-panel">背景畫面區塊</div>
    <div class="lobby-footer"><button class="btn-green btn-start-interview" onclick="goToInterview()">▶ 開始面試</button></div>
  </div>

  <div id="profile-section" class="section-container">
    <div class="setting-group">
      <h3>基本資料</h3>
      <div class="setting-box glass-panel" style="display: flex; flex-direction: column; gap: 20px;">
        <div style="display: flex; align-items: center; gap: 20px;">
          <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 36px; border: 2px solid var(--primary-green); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">👤</div>
          <div>
            <button class="btn-glass" style="padding: 8px 15px; font-size: 14px; width: auto; margin-bottom: 5px;">上傳新頭像</button>
            <div style="font-size: 12px; color: var(--text-sub);">支援 JPG, PNG 格式，大小限制 5MB 內</div>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div><label class="profile-label">帳號 Username (登入用)</label><input type="text" id="prof-username" class="reg-input" value="student01" disabled style="background: rgba(0,0,0,0.05); cursor: not-allowed; margin-bottom: 0;"></div>
          <div><label class="profile-label">顯示姓名 Full Name</label><input type="text" id="prof-name" class="reg-input" placeholder="請輸入姓名" value="林同學" style="margin-bottom: 0;"></div>
        </div>
        <div><label class="profile-label">聯絡信箱 Email</label><input type="email" id="prof-email" class="reg-input" placeholder="例如: user@example.com" style="margin-bottom: 0;"></div>
        <button class="btn-green" style="width: 150px; align-self: flex-end; padding: 12px 0;" onclick="alert('基本資料已儲存！')">儲存基本資料</button>
      </div>
    </div>
  </div>

  <div id="resume-section" class="section-container"><div class="resume-grid" id="resume-grid-container"></div></div>

  <div id="history-section" class="section-container">
    <div class="history-list glass-panel">
      <div class="history-row"><span>2026/3/30</span><span>後端工程師</span><span class="score">A+</span><span class="icon-view">📄</span></div>
    </div>
  </div>

  <div id="interview-section" class="section-container">
    <div class="interview-layout">
      <div class="video-area"><video id="localVideo" autoplay playsinline muted></video></div>
      <div class="transcript-area glass-panel" id="transcriptBox"><div class="ai-msg">系統：正在建立安全連線...</div></div>
    </div>
    <div class="controls"><button class="btn-end" onclick="endInterview()">結束面試</button></div>
  </div>

  <div id="register-modal-overlay" class="modal-overlay">...</div>
  <div id="resume-form-overlay" class="modal-overlay">...</div>
  <div id="resume-preview-overlay" class="modal-overlay">...</div>

  <script>
    // 🎯 2. 新增：【AI 辨識演算法核心】與面試數據狀態
    const EAR_THRESHOLD = 0.20;
    const SMILE_THRESHOLD = 1.45;
    const FROWN_THRESHOLD = 0.015;

    let faceMesh = null;
    let cameraUtil = null;
    let isEyeClosed = false;
    
    // 用來記錄整場面試的數據包
    let interviewSessionData = {
        total_frames: 0,
        blink_count: 0,
        happy_frames: 0,
        neutral_frames: 0,
        sad_frames: 0
    };

    function calcDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

    function calculateEAR(landmarks, eyeIndices) {
        const p1 = landmarks[eyeIndices[0]], p2 = landmarks[eyeIndices[1]];
        const p3 = landmarks[eyeIndices[2]], p4 = landmarks[eyeIndices[3]];
        const p5 = landmarks[eyeIndices[4]], p6 = landmarks[eyeIndices[5]];
        const distV1 = calcDistance(p2, p6);
        const distV2 = calcDistance(p3, p5);
        const distH = calcDistance(p1, p4);
        return (distV1 + distV2) / (2.0 * distH);
    }

    function calculateSmile(landmarks) {
        const mouthWidth = calcDistance(landmarks[61], landmarks[291]);
        const eyeDist = calcDistance(landmarks[133], landmarks[362]);
        return eyeDist !== 0 ? (mouthWidth / eyeDist) : 0;
    }

    function calculateFrown(landmarks) {
        return ((landmarks[61].y + landmarks[291].y) / 2.0) - landmarks[14].y;
    }

    // 🎯 3. 新增：初始化 FaceMesh 模型設定
    function setupFaceMesh() {
        if (faceMesh) return; // 避免重複建立
        
        faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // 當模型分析完每一張畫面後會觸發這個函數
        faceMesh.onResults((results) => {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                interviewSessionData.total_frames++;

                // 呼叫你的 AI 公式
                const smile_ratio = calculateSmile(landmarks);
                const frown_score = calculateFrown(landmarks);
                const left_ear = calculateEAR(landmarks, [33, 160, 158, 133, 153, 144]);
                const right_ear = calculateEAR(landmarks, [362, 385, 387, 263, 373, 380]);
                const avg_ear = (left_ear + right_ear) / 2.0;

                // 計算眨眼
                if (avg_ear < EAR_THRESHOLD && !isEyeClosed) {
                    interviewSessionData.blink_count++;
                    isEyeClosed = true;
                } else if (avg_ear >= EAR_THRESHOLD) {
                    isEyeClosed = false;
                }

                // 計算情緒
                if (smile_ratio > SMILE_THRESHOLD) {
                    interviewSessionData.happy_frames++;
                } else if (frown_score > FROWN_THRESHOLD) {
                    interviewSessionData.sad_frames++;
                } else {
                    interviewSessionData.neutral_frames++;
                }
            }
        });
    }

    // ================= 初始化與原本的 UI 邏輯 =================
    window.onload = () => {
      // (保留原本的履歷初始化代碼，為節省版面省略)
    };

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); }
    function navTo(sectionId, title) {
      document.querySelectorAll('.section-container').forEach(el => el.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
      document.getElementById('page-title').innerText = title;
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('active');
      if (sectionId === 'login-section' || sectionId === 'interview-section') {
        document.getElementById('top-bar').style.display = 'none';
      } else {
        document.getElementById('top-bar').style.display = 'flex';
      }
    }
    
    function loginSuccess() { navTo('lobby-section', '大廳'); }
    function handleLogin() { loginSuccess(); }
    function guestLogin() { loginSuccess(); }

    // ================= 面試相關 (被改寫的部分) =================
    async function goToInterview() { 
        navTo('interview-section', ''); 
        initCamera(); 
    }

    // 🎯 4. 改寫：啟動攝影機並餵給 MediaPipe
    async function initCamera() {
      const videoElement = document.getElementById('localVideo');
      
      // 重置面試數據包
      interviewSessionData = { total_frames: 0, blink_count: 0, happy_frames: 0, neutral_frames: 0, sad_frames: 0 };
      isEyeClosed = false;
      
      setupFaceMesh(); // 啟動你的大腦模型

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        videoElement.srcObject = stream;

        // 使用 MediaPipe 的 Camera 工具，自動把鏡頭畫面送進 faceMesh
        if (!cameraUtil) {
            cameraUtil = new Camera(videoElement, {
                onFrame: async () => {
                    await faceMesh.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
        }
        cameraUtil.start();

      } catch (err) { alert("記得要允許瀏覽器使用攝影機跟麥克風喔！"); }
    }

    // 🎯 5. 改寫：結束面試並打包發送 API
    function endInterview() {
      const videoElement = document.getElementById('localVideo');
      
      // 關閉鏡頭與 AI 分析
      if (videoElement.srcObject) { videoElement.srcObject.getTracks().forEach(track => track.stop()); }
      if (cameraUtil) { cameraUtil.stop(); }

      // 算總結數據
      const total = interviewSessionData.total_frames || 1; // 避免除以0
      const finalPayload = {
          user_id: document.getElementById('prof-username').value || "student_01",
          confidence_score: 85.0, // 可以改成自己換算的邏輯
          blink_count: interviewSessionData.blink_count,
          happy_ratio: Number((interviewSessionData.happy_frames / total).toFixed(2)),
          neutral_ratio: Number((interviewSessionData.neutral_frames / total).toFixed(2)),
          sad_ratio: Number((interviewSessionData.sad_frames / total).toFixed(2)),
          ai_feedback: "表現優異，系統已成功記錄特徵點數據！"
      };

      console.log("📦 準備送給 Python 後端的包裹：", finalPayload);

      // 呼叫 API 傳送 (請確保你的 W7 FastAPI 有開著)
      fetch('http://127.0.0.1:8000/api/save_report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(finalPayload)
      })
      .then(res => res.json())
      .then(data => console.log("✅ 後端回應：", data.message))
      .catch(err => console.error("❌ API 連線失敗 (可能後端沒開)：", err));

      alert("面試結束！數據已發送，退回大廳。"); 
      navTo('lobby-section', '大廳');
    }
  </script>
