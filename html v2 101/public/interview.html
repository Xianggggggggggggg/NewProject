<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>面試中 - AI 智慧面試系統</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="section-container active" id="interview-section" style="padding-top: 50px;">
        <div class="interview-layout">
            <div class="video-area">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="transcript-area glass-panel" id="transcriptBox">
            </div>
        </div>
        <div class="controls">
            <button class="btn-end" onclick="handleEndInterview()">結束面試</button>
        </div>
    </div>

    <script src="js/interview.js"></script>

    <script src="js/app.js" defer></script>
</body>

</html>
