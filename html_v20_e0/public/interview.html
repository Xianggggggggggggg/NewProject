<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>面試中 - CareerLab</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* 整體佈局：左邊視訊區，右邊對話區 */
        .interview-layout-multi {
            display: flex;
            gap: 20px;
            max-width: 1600px; 
            width: 95%; 
            margin: 0 auto;
            height: 85vh; 
        }

        /* 視訊區：2x2 網格 */
        .video-grid {
            flex: 3; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px; 
        }

        /* 視訊框樣式 */
        .video-card {
            background-color: #2c2c2c;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 視訊標籤 */
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 10;
        }

        /* 面試者視訊鏡頭 */
        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* 右側文字紀錄區 */
        .transcript-area {
            flex: 1; 
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 底部控制區 */
        .controls {
            text-align: center;
            margin-top: 20px;
        }

        /* 調整 3D 模型元件的大小 */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
    </style>
</head>

<body>
    <div class="section-container active" id="interview-section" style="padding-top: 30px;">
        
        <div class="interview-layout-multi">
            <div class="video-grid">
                <div class="video-card" id="ai-interviewer-1">
                    <video 
                        id="aiModel_Tech" 
                        src="./men.mp4" 
                        autoplay loop muted playsinline 
                        style="width: 100%; height: 100%; object-fit: cover; background-color: #72acc5;">
                    </video>
                    <div class="video-label">AI 面試官 (技術主管)</div>
                </div>

                <div class="video-card" id="ai-interviewer-2">
                    <video 
                        id="aiModel_HR" 
                        src="./women.mp4" 
                        autoplay loop muted playsinline 
                        style="width: 100%; height: 100%; object-fit: cover; background-color: #9c9a9a;">
                    </video>
                    <div class="video-label">AI 面試官 (HR)</div>
                </div>

                <div class="video-card" id="human-interviewer">
                    <span style="color:#888;">等待真人面試官加入...</span>
                    <div class="video-label">真人面試官</div>
                </div>

                <div class="video-card" id="interviewee-cam">
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="video-label">你 (微表情分析中)</div>
                </div>

            </div>

            <div class="transcript-area glass-panel" id="transcriptBox">
                <h3 style="margin-top:0; border-bottom: 1px solid #ccc; padding-bottom: 10px;">對話紀錄</h3>
            </div>

        </div>

        <div class="controls">
            <button class="btn-end" onclick="handleEndInterview()">結束面試</button>
        </div>
    </div>

    <script src="js/interview.js"></script>
    <script src="js/app.js" defer></script>
</body>
</html>
