<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>我的履歷 - CareerLab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>

  <div class="section-container active">
    <div class="resume-grid" id="resume-grid-container"></div>
  </div>

  <div id="resume-form-overlay" class="modal-overlay">
    <div class="register-modal resume-form-modal">
      <h2 id="resume-modal-title">新增履歷</h2>
      <p>完整的履歷能幫助 AI 更精準提問</p>
      <input type="hidden" id="res-id"> 
      <input type="text" id="res-name" class="reg-input" placeholder="履歷自訂名稱 (例如：前端工程師專用)">
      <div style="display: flex; gap: 10px;">
        <input type="text" id="res-edu" class="reg-input" style="flex: 1;" placeholder="最高學歷">
        <select id="res-gender" class="reg-input" style="flex: 1;"><option value="" disabled selected>選擇性別</option><option value="男">男</option><option value="女">女</option><option value="不透露">不透露</option></select>
      </div>
      <input type="text" id="res-lang" class="reg-input" placeholder="語言能力 (例如：英文 多益 850)">
      <textarea id="res-exp" class="reg-input" placeholder="工作與專案經歷  (可條列式填寫)"></textarea>
      <textarea id="res-bio" class="reg-input" placeholder="自傳或個人簡介 (約 100-300 字)"></textarea>
      <button class="btn-reg-submit" onclick="saveResume()">儲存履歷</button>
      <a class="back-link" onclick="closeResumeFormModal()">取消並關閉</a>
    </div>
  </div>

  <div id="resume-preview-overlay" class="modal-overlay">
    <div class="register-modal preview-modal resume-form-modal">
      <h2>履歷預覽</h2><div id="preview-content"></div>
      <button class="btn-green" style="width: 100%; margin-top: 20px; padding: 15px; border-radius: 10px;" onclick="closePreviewModal()">關閉預覽</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
