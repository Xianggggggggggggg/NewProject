<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面試完成 - CareerLab</title>
    <style>
        /* 🌟 引入主視覺的變數系統 */
        :root {
            --primary-green: #799851;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 1);
            --glass-shadow: rgba(0, 0, 0, 0.05);
            --glass-blur: blur(16px); 
        }

        /* 🌟 統一背景：淺灰白背景 + 柔和漸層光暈 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f8;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(16, 172, 132, 0.08), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(41, 128, 185, 0.05), transparent 30%);
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 🌟 升級為毛玻璃面板卡片 */
        .success-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1.5px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 var(--glass-shadow);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* 🌟 統一使用主題綠色 */
        .check-icon {
            font-size: 80px;
            color: var(--primary-green);
            margin-bottom: 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .title {
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .message {
            color: var(--text-sub);
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .highlight {
            color: var(--primary-green);
            font-weight: bold;
        }

        /* 🌟 統一按鈕風格與浮動光影特效 */
        .home-btn {
            background: var(--primary-green);
            color: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 14px 36px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 1px;
        }

        .home-btn:hover {
            box-shadow: 0 4px 15px rgba(121, 152, 81, 0.3);
            transform: translateY(-2px);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="check-icon">✔</div>
        
        <h1 class="title">面試順利完成！辛苦了！</h1>
        
        <p class="message">
            您的面試影音紀錄與專屬分析，<br>
            已經 <span class="highlight">安全、完整地加密送達</span> 給人資與部門主管囉！<br><br>
            系統已經為您妥善保存所有資料。<br>
            現在請好好放鬆休息，靜候公司的佳音。
        </p>

        <a href="lobby.html" class="home-btn">回到系統大廳</a>
    </div>

</body>
</html>
