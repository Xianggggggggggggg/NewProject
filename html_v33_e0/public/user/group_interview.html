<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧團體面試</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="/user/css/group_interview.css">
</head>
<body>

<div class="layout-wrapper">
    
    <div class="video-section">
        <div class="status-bar" id="status-text">🔄 正在連線至面試房間...</div>

        <div class="ai-stage">
            <div class="ai-box glass-panel">
                <video id="aiModel_Tech" class="video-avatar active" src="../men.mp4" autoplay loop muted playsinline></video>
                <video id="talkVideo_Tech" class="video-avatar" src="../mentalk.mp4" loop muted playsinline style="opacity: 0;"></video>
                <div class="ai-label">🤖 AI 技術主管</div>
            </div>
            
            <div class="ai-box glass-panel">
                <video id="aiModel_HR" class="video-avatar active" src="../women.mp4" autoplay loop muted playsinline></video>
                <video id="talkVideo_HR" class="video-avatar" src="../womentalk.mp4" loop muted playsinline style="opacity: 0;"></video>
                <div class="ai-label">👩‍💼 AI 人資 (HR)</div>
            </div>

            <div class="ai-box glass-panel" id="human-hr-box">
                <div id="hr-waiting-placeholder" class="waiting-placeholder">
                    <span>等待真人面試官加入...</span>
                </div>
                <video id="humanHrVideo" class="video-avatar" autoplay playsinline style="transform: scaleX(-1); opacity: 0; z-index: 20;"></video>
                <div class="ai-label" style="background: rgba(45, 52, 54, 0.8);" id="hr-label">👤 真人面試官</div>
            </div>
        </div>

        <div class="section-title">— 參與面試的應徵者 —</div>
        <div id="video-grid">
            </div>
    </div>
    <div class="chat-section glass-panel">
        <div class="chat-header">💬 即時對話紀錄</div>
        <div id="transcriptBox">
            <div class="ai-msg">
                <b>系統提示：</b>連線成功，正在為您分配團體面試座位...<br>
                <small style="color: var(--text-sub);">💡 提示：面試官提問後，請留意畫面發光提示，並依序作答。</small>
            </div>
        </div>
    </div>
    </div>
<script src="/user/js/group_interview.js"></script>
</body>
</html>
