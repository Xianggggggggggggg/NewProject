<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>面試結果 - CareerLab</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar-container"></div>
  <div id="sidebar-container"></div>

  <div class="section-container active">
    <div style="display: flex; max-width: 1100px; width: 100%; margin: 0 auto; gap: 40px; align-items: flex-start;">
      <div style="flex: 1; text-align: center; padding-top: 50px;">
        <h1 style="font-size: 120px; color: var(--primary-green); margin: 0; line-height: 1;">A+</h1>
        <h2 style="color: var(--text-main); margin-top: 10px; font-size: 28px;">表現優異！</h2>
      </div>
      <div class="glass-panel" style="flex: 2; background: #fff; padding: 40px 50px; border-radius: 20px; min-height: 500px; display: flex; flex-direction: column;">
        <h3 style="margin: 0 0 20px 0; color: var(--text-main); border-bottom: 2px solid var(--primary-green); padding-bottom: 15px; font-size: 24px;">AI 適職性分析報告</h3>
        <div id="result-report-content" style="flex: 1; line-height: 1.8; color: var(--text-sub); font-size: 16px; white-space: pre-wrap;">
【專注度分析】
全程視線專注度達 92%，情緒穩定度極高，展現出良好的抗壓性。

【專業能力評估】
能夠清晰描述過往經歷，邏輯條理分明。針對技術/情境題的回答具備深度，展現出解決問題的能力。

【綜合建議】
溝通能力極佳，具備團隊合作潛力。建議未來可多強調專案中的具體量化成果，能進一步提升說服力。
        </div>
        <button class="btn-green" style="width: 200px; margin-top: 40px; align-self: flex-end; padding: 15px;" onclick="window.location.href='lobby.html'">回首頁大廳</button>
      </div>
    </div>
  </div>
  <script src="js/app.js" defer></script>
</body>
</html>
